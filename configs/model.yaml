# Frozen ResNet18 + small causal TCN; data scripts never start training.
backbone: resnet18
pretrained_weights: IMAGENET1K_V1
freeze_backbone: true
feature_dim: 512
input_size: [224, 224]
color_mode: grayscale_repeated_to_rgb
resize_backend: PIL
resize_interpolation: bilinear
pixel_scale: 255.0
normalization_mean: [0.485, 0.456, 0.406]
normalization_std: [0.229, 0.224, 0.225]
window_size: 32
tcn_channels: [64, 64, 64, 64]
kernel_size: 3
dilations: [1, 2, 4, 8]
causal: true
dropout: 0.2
num_classes: 2
label_map: {normal: 0, feeding: 1}

